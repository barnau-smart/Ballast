[project]
name = "ballast-backend"
version = "0.1.0"
description = "Ballast — AI investing coach. Backend API."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.136.*",
    "anyio",
    "uvicorn[standard]",
    "psycopg[binary]",
    "pydantic-settings",
    "fastapi-users[sqlalchemy]==15.*",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "cryptography",
    "schwab-py==1.5.1",
    "anthropic>=0.120,<0.121",
    "tiingo>=0.16,<0.17",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Story 8.5: the suite is fast enough (whole default lane runs in ~1 minute, well
# under the 600s timeout) that NO fast/slow split is needed today — the shared
# session-scoped app + one-time DDL + test-only fast password hasher (see
# tests/conftest.py) carry the win. The `slow` marker is registered so that if a
# genuinely expensive test is ever added, it can be tagged `@pytest.mark.slow`
# and the lanes split without churn.
#
# Commands (run from ballast/backend, DB up: `docker compose up -d db`):
#   Fast default lane (everything):      uv run pytest -q
#   Just the (formerly slow) coach API:  uv run pytest tests/test_coach_api.py -q
#   Full suite incl. any future slow:    uv run pytest -q -m "slow or not slow"
# No test is currently classified `slow`; the default lane == the full suite.
markers = [
    "slow: marks a test as slow (deselect with '-m \"not slow\"'); none today (Story 8.5)",
    "real_hasher: run this test against production pwdlib/Argon2 (opts OUT of the test-only fast password hasher in tests/conftest.py); for tests that assert real hashing/security properties (e.g. test_register.py)",
]
