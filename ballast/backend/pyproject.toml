[project]
name = "ballast-backend"
version = "0.1.0"
description = "Ballast — AI investing coach. Backend API."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.136.*",
    "uvicorn[standard]",
    "psycopg[binary]",
    "pydantic-settings",
    "fastapi-users[sqlalchemy]==15.*",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
